name: CI & Cross-Platform Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Unit Tests
        run: go test -v -race ./...
      - name: Check MCP stdio lifecycle and tools
        run: |
          go build -o bin/agentwall ./cmd/agentwall
          python3 scripts/check_mcp_stdio.py ./bin/agentwall serve
          python3 scripts/check_mcp_stdio.py ./bin/agentwall mcp
      - name: Check container MCP entrypoint
        run: |
          docker build -t agentwall-mcp .
          python3 scripts/check_mcp_stdio.py docker run --rm -i --network none agentwall-mcp
      - name: Build Multi-OS Binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/agentwall-linux-amd64 ./cmd/agentwall
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/agentwall-darwin-arm64 ./cmd/agentwall
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/agentwall-windows-amd64.exe ./cmd/agentwall
